name: Supabase Keepalive

on:
  schedule:
    - cron: '0 0 */3 * *' # Runs at 00:00 every 3 days
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "Pinging database to prevent Supabase from pausing the project..."
          psql "$DATABASE_URL" -c "SELECT 1;"
